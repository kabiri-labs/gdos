[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gdos"
version = "2.1.0"
description = "GraphQL DoS resilience scanner — verify a GraphQL endpoint is hardened against DoS amplification attacks."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["requests>=2.31,<3"]

[project.optional-dependencies]
dev = ["pytest>=7", "responses>=0.25"]

[project.scripts]
gdos = "gdos.cli:main"

[tool.setuptools.packages.find]
include = ["gdos*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
